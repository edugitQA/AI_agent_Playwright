# .github/workflows/deploy-dashboard.yml

name: Deploy Automation Health Dashboard

on:
  push:
    branches:
      - master 
      - 'feature/dashboard-metricas-agente' # Para testar a feature atual
    paths:
      - 'automation-dashboard/**'
      - '.github/workflows/deploy-dashboard.yml' # Re-executa se o workflow for alterado
  
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Só usa environment GitHub Pages se for master
    environment: ${{ github.ref == 'refs/heads/master' && 'github-pages' || '' }}

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'automation-dashboard/package-lock.json'

      - name: 3. Instalar Dependências do Dashboard
        run: npm --prefix automation-dashboard ci

      - name: 4. Copiar Métricas para o Dashboard (se existir)
        run: |
          mkdir -p automation-dashboard/public/
          # Verifica se o arquivo de métricas existe
          if [ -f "metrics/dashboard-metrics.json" ]; then
            echo "✅ Arquivo de métricas encontrado, copiando..."
            cp metrics/dashboard-metrics.json automation-dashboard/public/
          else
            echo "ℹ️  Arquivo de métricas não encontrado. Criando dados vazios para o primeiro deploy."
            echo '{"lastUpdate":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","totalTests":0,"successRate":0,"corrections":[],"summary":"Aguardando primeira execução dos testes"}' > automation-dashboard/public/dashboard-metrics.json
          fi

      - name: 5. Build do Dashboard
        run: npm --prefix automation-dashboard run build

      # Steps condicionais: só executa deploy para GitHub Pages se for master
      - name: 6. Configurar GitHub Pages
        if: github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: 7. Upload do Artefato do Build
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./automation-dashboard/dist

      - name: 8. Deploy para GitHub Pages
        if: github.ref == 'refs/heads/master'
        id: deployment
        uses: actions/deploy-pages@v4

      # Upload como artefato para outras branches (para teste)
      - name: 9. Upload Build para Teste (outras branches)
        if: github.ref != 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build-test-${{ github.ref_name }}
          path: ./automation-dashboard/dist