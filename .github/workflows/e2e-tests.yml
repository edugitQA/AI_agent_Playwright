name: E2E Tests com Auto-Correção

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Execução programada às 03:00 todos os dias
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Executar em modo debug'
        required: false
        default: 'false'
      test_filter:
        description: 'Filtro de testes (ex: contact-form.spec.ts)'
        required: false
        default: ''
      app_url:
        description: 'URL da aplicação (padrão: produção)'
        required: false
        default: 'https://front-test-automation.onrender.com/'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: |
          # Limpar cache do npm em caso de problemas
          npm cache clean --force
          # Instalar dependências
          npm ci
          # Verificar se @playwright/test foi instalado corretamente
          npm list @playwright/test

      - name: Instalar browsers do Playwright
        run: |
          # Primeiro tentar instalar os browsers
          npx playwright install --with-deps chromium
          
          # Verificar instalação
          npx playwright --version

      - name: Configurar Python para o agente
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar URL da aplicação
        id: set_url
        run: |
          APP_URL="https://front-test-automation.onrender.com/"
          echo "APP_URL=$APP_URL" >> $GITHUB_ENV
          echo "app_url=$APP_URL" >> $GITHUB_OUTPUT
          echo "Usando URL da aplicação: $APP_URL"

      - name: Verificar conectividade com a aplicação
        run: |
          APP_URL="https://front-test-automation.onrender.com/"
          echo "Verificando conectividade com $APP_URL..."
          curl --retry 3 --retry-delay 5 --fail $APP_URL || (echo "⚠️ Aviso: Não foi possível acessar a aplicação. Os testes podem falhar." && exit 0)

      - name: Executar testes com o agente de auto-correção
        env:
          CI: true
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BASE_URL: "https://front-test-automation.onrender.com/"
        run: |
          echo "Executando testes com o agente de auto-correção..."
          echo "URL da aplicação: https://front-test-automation.onrender.com/"
          echo "Ambiente CI: $CI"
          
          # Executar os testes com a URL remota explicitamente
          npx playwright test tests/contact-form.spec.ts tests/login.spec.ts --reporter=line --project=chromium --config=playwright.config.ts

      - name: Upload artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
            logs/
