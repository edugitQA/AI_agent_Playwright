name: E2E Tests com Auto-Correção

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # Executa diariamente às 03:00 BRT (06:00 UTC)

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Configurar PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 4. Instalar Dependências (NPM para a raiz, PNPM para o App)
        run: |
          echo "Instalando dependências da raiz com NPM..."
          npm ci
          echo "Instalando dependências da aplicação React com PNPM..."
          pnpm install --dir ./sample-react-app --frozen-lockfile

      - name: 5. Instalar Navegadores Playwright
        run: npx playwright install --with-deps chromium

      - name: 6. Configurar Python para o Agente de IA
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 7. Instalar Dependências (Python)
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: 8. Criar Diretórios para Logs e Snapshots
        run: mkdir -p logs dom_snapshots

      - name: 9. Executar Testes com o Agente de Auto-Correção
        env:
          CI: true
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npx playwright test login.spec.ts

      - name: 10. Upload dos Artefatos de Teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ github.run_id }}
          path: |
            test-results/
            playwright-logs/

      - name: 11. Compilar Histórico de Seletores (opcional)
        if: always()
        run: node .github/scripts/compile-selector-history.js

      - name: 12. Upload dos Artefatos de Histórico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selector-history-report-${{ github.run_id }}
          path: test-artifacts/reports/selector-history.html

     
