name: E2E Tests com Auto-Correção

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # Executa diariamente às 03:00 BRT (06:00 UTC)

permissions:
  contents: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      metrics_updated: ${{ steps.check_metrics.outputs.updated }}

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Configurar PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 4. Instalar Dependências (NPM para a raiz, PNPM para o App)
        run: |
          echo "Instalando dependências da raiz com NPM..."
          npm ci
          echo "Instalando dependências da aplicação React com PNPM..."
          pnpm install --dir ./sample-react-app --frozen-lockfile

      - name: 5. Instalar Navegadores Playwright
        run: npx playwright install --with-deps chromium

      - name: 6. Configurar Python para o Agente de IA
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: 7. Instalar Dependências (Python)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 8. Criar Diretórios para Logs e Snapshots
        run: mkdir -p logs dom_snapshots

      - name: 9. Validar Configuração da API OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "❌ OPENAI_API_KEY não configurada nos secrets!"
            exit 1
          else
            echo "✅ OPENAI_API_KEY configurada"
          fi

      - name: 10. Executar Testes com o Agente de Auto-Correção
        env:
          CI: true
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npx playwright test login.spec.ts

      - name: 10. Coletar Novas Métricas de Atividade
        if: always()
        run: node .github/scripts/generate-agent-report.js
        
      - name: 10.1. Verificar se Métricas foram Atualizadas
        id: check_metrics
        run: |
          if [ -f "metrics/agent_activity.log" ] && [ -s "metrics/agent_activity.log" ]; then
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "✅ Métricas encontradas e serão enviadas para o dashboard"
          else
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Nenhuma métrica nova encontrada"
          fi
        
      - name: 11. Adicionar o arquivo de log ao Git (se for novo)
        run: git add metrics/agent_activity.log

      - name: 12. Fazer Commit e Push do Log de Atividades
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(metrics): Adiciona novas atividades do agente [skip ci]"
          # Altera o arquivo que estamos monitorando
          file_pattern: metrics/agent_activity.log

      - name: 12. Upload dos Artefatos de Teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
            logs/
            metrics/agent_activity.log

  deploy:
    runs-on: ubuntu-latest

    needs: test # 1. Garante que este job só rode APÓS o job 'test' terminar com sucesso.
    if: always() && needs.test.result == 'success' && needs.test.outputs.metrics_updated == 'true'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4
        with:
          # Precisamos fazer fetch do commit que o job anterior acabou de criar
          ref: master 

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'automation-dashboard/package-lock.json'

      - name: 3. Instalar Dependências do Dashboard
        working-directory: ./automation-dashboard
        run: npm ci

      - name: 4. Copiar Métricas para o Dashboard
        run: |
          mkdir -p automation-dashboard/public/metrics/
          cp metrics/agent_activity.log automation-dashboard/public/metrics/ 2>/dev/null || echo "Arquivo de métricas não encontrado, criando vazio" && touch automation-dashboard/public/metrics/agent_activity.log

      - name: 5. Build do Dashboard
        working-directory: ./automation-dashboard
        run: npm run build

      - name: 6. Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: 7. Upload do Artefato do Build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./automation-dashboard/dist

      - name: 8. Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
     
