name: E2E Tests com Auto-Correção

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Execução programada às 03:00 todos os dias
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Executar em modo debug'
        required: false
        default: 'false'
      test_filter:
        description: 'Filtro de testes (ex: contact-form.spec.ts)'
        required: false
        default: ''
      app_url:
        description: 'URL da aplicação (padrão: produção)'
        required: false
        default: 'https://front-test-automation.onrender.com/'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: |
          # Limpar cache do npm em caso de problemas
          npm cache clean --force
          # Instalar dependências
          npm ci
          # Verificar se @playwright/test foi instalado corretamente
          npm list @playwright/test
          # Verificar estrutura node_modules
          ls -la node_modules/@playwright/ || echo "Diretório @playwright não encontrado"

      - name: Instalar browsers do Playwright
        run: |
          # Primeiro tentar instalar os browsers
          npx playwright install --with-deps chromium
          
          # Se houver problemas, tentar reinstalar playwright
          if ! npx playwright --version; then
            echo "Problema com Playwright, tentando reinstalar..."
            npm uninstall @playwright/test
            npm install @playwright/test@^1.54.1
            npx playwright install --with-deps chromium
          fi

      - name: Configurar Python para o agente
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install langgraph langchain langchain-openai openai beautifulsoup4

      - name: Verificar URL da aplicação
        run: |
          echo "APP_URL=https://front-test-automation.onrender.com/" >> $GITHUB_ENV
          echo "Usando URL da aplicação: https://front-test-automation.onrender.com/"

      - name: Verificar conectividade com a aplicação
        run: |
          echo "Verificando conectividade com $APP_URL..."
          curl --retry 3 --retry-delay 5 --fail $APP_URL || (echo "⚠️ Aviso: Não foi possível acessar a aplicação. Os testes podem falhar." && exit 0)

      - name: Executar testes com o agente de auto-correção
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PLAYWRIGHT_TEST_BASE_URL: ${{ env.APP_URL }}
        run: |
          echo "Executando testes com o agente de auto-correção..."
          echo "URL da aplicação: $APP_URL"
          
          # Debug: Verificar se os arquivos de teste existem
          ls -la tests/
          echo "Verificando se os testes existem:"
          test -f tests/contact-form.spec.ts && echo "✓ contact-form.spec.ts encontrado" || echo "✗ contact-form.spec.ts não encontrado"
          test -f tests/login.spec.ts && echo "✓ login.spec.ts encontrado" || echo "✗ login.spec.ts não encontrado"
          
          # Debug: Verificar configuração do Playwright
          echo "Verificando configuração do Playwright:"
          npx playwright --version
          
          # Debug: Verificar se o módulo pode ser importado
          node -e "try { require('@playwright/test'); console.log('✓ @playwright/test importado com sucesso'); } catch(e) { console.log('✗ Erro ao importar @playwright/test:', e.message); }"
          
          # Executar apenas os testes contact-form.spec.ts e login.spec.ts
          npx playwright test tests/contact-form.spec.ts tests/login.spec.ts --reporter=line

      - name: Upload artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
            logs/
