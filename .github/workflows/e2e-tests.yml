name: E2E Tests com Auto-Correção

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Instalar Dependências (Projeto Principal)
        run: npm ci

      # --- NOVO PASSO ADICIONADO ---
      - name: 4. Instalar Dependências (Aplicação React)
        run: npm ci --prefix sample-react-app

      - name: 5. Instalar Navegadores Playwright
        run: npx playwright install --with-deps chromium

      - name: 6. Configurar Python para o Agente de IA
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 7. Instalar Dependências (Python)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 8. Executar Testes com o Agente de Auto-Correção
        env:
          CI: true
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # O Playwright agora iniciará o webServer automaticamente antes dos testes
          npx playwright test

      - name: 9. Upload dos Artefatos de Teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
            logs/
            dom_snapshots/
          retention-days: 7