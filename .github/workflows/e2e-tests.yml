name: E2E Tests com Auto-Correção

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # Executa diariamente às 03:00 BRT (06:00 UTC)

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Configurar PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 4. Instalar Dependências (NPM para a raiz, PNPM para o App)
        run: |
          echo "Instalando dependências da raiz com NPM..."
          npm ci
          echo "Instalando dependências da aplicação React com PNPM..."
          pnpm install --dir ./sample-react-app --frozen-lockfile

      - name: 5. Instalar Navegadores Playwright
        run: npx playwright install --with-deps chromium

      - name: 6. Configurar Python para o Agente de IA
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: 7. Instalar Dependências (Python)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 8. Criar Diretórios para Logs e Snapshots
        run: mkdir -p logs dom_snapshots

      - name: 9. Validar Configuração da API OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "❌ OPENAI_API_KEY não configurada nos secrets!"
            exit 1
          else
            echo "✅ OPENAI_API_KEY configurada"
          fi

      - name: 9. Executar Testes com o Agente de Auto-Correção
        env:
          CI: true
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npx playwright test login.spec.ts

      - name: 10. Gerar Métricas e Relatório de Saúde
        if: always()
        run: node .github/scripts/generate-agent-report.js

      - name: 11. Verificar por Alterações no Arquivo de Métricas
        id: git-check
        run: |
          echo "Verificando alterações em 'metrics/dashboard-metrics.json'..."
          git diff --quiet --exit-code metrics/dashboard-metrics.json || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: 12. Commit e Push das Métricas (se houver alterações)
        if: steps.git-check.outputs.has_changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(metrics): Atualiza métricas do dashboard de automação [skip ci]"
          file_pattern: metrics/dashboard-metrics.json
          commit_user_name: GitHub Actions Bot
          commit_user_email: actions@github.com
          commit_author: GitHub Actions Bot <actions@github.com>

      - name: 13. Upload dos Artefatos de Teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
            logs/
            dom_snapshots/
            metrics/dashboard-metrics.json # Salva o JSON gerado

      - name: 14. Compilar Histórico de Seletores (opcional)
        if: always()
        run: |
          if [ -f ".github/scripts/compile-selector-history.js" ]; then
            node .github/scripts/compile-selector-history.js
          else
            echo "ℹ️ Script de histórico não encontrado, pulando..."
          fi

      - name: 15. Upload dos Artefatos de Histórico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selector-history-report-${{ github.run_id }}
          path: test-artifacts/reports/selector-history.html

     
