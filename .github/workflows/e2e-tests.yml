name: E2E Tests com Auto-Correção

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Adicionado um timeout para o job inteiro

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Habilitar cache para acelerar instalações

      - name: 3. Instalar Dependências (Node.js)
        run: |
          npm ci
          npx playwright install --with-deps chromium # Instalar apenas o chromium para agilizar

      - name: 4. Configurar Python para o Agente de IA
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Habilitar cache para o pip

      - name: 5. Instalar Dependências (Python)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 6. Construir e Iniciar a Aplicação React em Background
        run: |
          npm run build --prefix sample-react-app
          npm run preview --prefix sample-react-app &
        env:
          # A porta 4173 é a padrão do `npm run preview` do Vite.
          # O `playwright.config.ts` já está configurado para usar `http://localhost:5173`,
          # mas o preview do vite por padrão usa a 4173. Vamos ajustar o BASE_URL para refletir isso.
          BASE_URL: http://localhost:4173

      - name: 7. Executar Testes com o Agente de Auto-Correção
        env:
          CI: true
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Usamos a porta padrão do `vite preview`
          BASE_URL: http://localhost:4173
        run: |
          echo "Executando testes na URL: $BASE_URL"
          # Executa todos os testes. O agente será acionado automaticamente
          # pelo `self_healing_runner.js` quando um seletor falhar.
          npx playwright test

      - name: 8. Upload dos Artefatos de Teste
        if: always() # Garante que os artefatos sejam salvos mesmo se os testes falharem
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
            logs/
            dom_snapshots/
          retention-days: 7 # Guardar os artefatos por 7 dias