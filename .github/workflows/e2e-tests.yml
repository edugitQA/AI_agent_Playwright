name: E2E Tests com Auto-Correção

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # Roda todo dia às 6 da manhã

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Instalar PNPM Globalmente
        run: npm install -g pnpm

      - name: 4. Instalar Dependências (NPM para a raiz, PNPM para o App)
        run: |
          echo "Instalando dependências da raiz com NPM..."
          npm ci
          echo "Instalando dependências da aplicação React com PNPM..."
          pnpm install --dir ./sample-react-app --frozen-lockfile

      - name: 5. Instalar Navegadores Playwright
        run: npx playwright install --with-deps chromium

      - name: 6. Configurar Python para o Agente de IA
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'agent/requirements.txt'

      - name: 7. Instalar Dependências (Python)
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: 8. Criar Diretórios para Logs e Snapshots
        run: |
          mkdir -p logs
          mkdir -p dom_snapshots

      - name: 9. Executar Testes com o Agente de Auto-Correção
        env:
          CI: true
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npx playwright test login.spec.ts

      - name: 10. Gerar Métricas e Relatório de Saúde
        if: always()
        run: node .github/scripts/generate-agent-report.js

      - name: 11. Verificar por Alterações no Arquivo de Métricas
        id: git-check
        run: |
          echo "Verificando alterações em 'metrics/dashboard-metrics.json'..."
          git diff --quiet --exit-code metrics/dashboard-metrics.json || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: 12. Commit e Push das Métricas (se houver alterações)
        if: steps.git-check.outputs.has_changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # A CORREÇÃO PRINCIPAL: Usa o PAT para permitir que este commit acione o outro workflow
          token: ${{ secrets.PAT }}
          
          commit_message: "chore(metrics): Atualiza métricas do dashboard de automação [skip ci]"
          file_pattern: metrics/dashboard-metrics.json
          commit_user_name: GitHub Actions Bot
          commit_user_email: actions@github.com
          commit_author: GitHub Actions Bot <actions@github.com>

      - name: 13. Upload dos Artefatos de Teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
            logs/
            dom_snapshots/
            metrics/dashboard-metrics.json